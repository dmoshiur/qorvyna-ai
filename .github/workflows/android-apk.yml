# =============================================================================
# QORVYNA AI — easy Android APK build (GitHub Actions)
#
# Why this exists: the local APK build needs Rust + 4 Android targets, JDK 17,
# the Android SDK + NDK and several minutes of Gradle. Most of the time nobody
# wants to set that up just to get an installable APK — so this workflow builds
# one on GitHub's servers on every push to `main` (and on app-related PRs, and
# on demand from the Actions tab) and uploads it as a downloadable artifact.
#
# Every APK is signed with the ONE QORVYNA key (signing/README.md) — never a
# runner-generated debug key — so each new APK installs as an in-place update
# of the previous one instead of failing with "App not installed as package
# conflicts with an existing package". The build fails before publishing if
# the APK carries any other certificate.
#
# It runs the same command a developer runs locally: `npm run android:apk:release`.
# =============================================================================

name: Android APK build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

permissions:
  # contents: write is what allows publishing the public apk-latest release
  # (the release step itself only runs on pushes to main).
  contents: write
  pull-requests: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK (build-tools 34, platform
      # android-34, NDK 27.x with ANDROID_HOME/ANDROID_NDK_HOME pre-set), so
      # no setup-android action is needed — only licence acceptance, which
      # lets Gradle auto-fetch any exact package version it wants.
      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null || true

      # The runner image sets ANDROID_NDK_HOME; Tauri's Android toolchain wants
      # NDK_HOME, so point it at the same preinstalled NDK explicitly.
      - name: Resolve the Android NDK path
        run: |
          if [ -z "$NDK_HOME" ]; then
            NDK="$ANDROID_NDK_HOME"
            if [ -z "$NDK" ]; then
              NDK="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
            fi
            echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
            echo "Using NDK: $NDK"
          fi

      - name: Set up Rust with the Android cross-compile targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies (exactly as the lockfile pins)
        run: npm ci --no-audit --no-fund

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p signing
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > signing/qorvyna-upload.jks
            echo "[sign] using the keystore from repository secrets"
          else
            echo "[sign] no secrets configured — using the committed debug-grade keystore"
          fi
          STORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:-$(cat signing/keystore-password.txt)}"
          KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$(cat signing/keystore-password.txt)}"
          KEY_ALIAS="${ANDROID_KEY_ALIAS:-qorvyna}"
          {
            echo "storeFile=$GITHUB_WORKSPACE/signing/qorvyna-upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing/keystore.properties
          sed 's/storePassword=.*/storePassword=***/; s/keyPassword=.*/keyPassword=***/' signing/keystore.properties

      # Bundles the frontend (Firebase config baked in from google-services.json),
      # initializes + patches + brands the generated Android project, places
      # keystore.properties into it, and builds the signed RELEASE APK — one
      # command, identical to the documented local release build.
      - name: Build the signed release APK
        run: |
          npm run android:apk:release 2>&1 | tee "$RUNNER_TEMP/build.log"
          exit "${PIPESTATUS[0]}"

      # Boot the bundled frontend (exactly what the APK ships) in headless
      # Chrome with the app's CSP: fails on boot errors, a blank screen or a
      # missing stylesheet instead of publishing an APK that opens white.
      - name: Boot-test the bundled app frontend
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" \
            npm run native:smoke 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          exit "${PIPESTATUS[0]}"

      # GitHub now requires sign-in to view raw logs; the step summary is
      # public, so on failure publish the tail there where it is readable.
      - name: Publish the build log tail on failure
        if: failure()
        run: |
          {
            echo "### Android APK build — log tail"
            echo '```'
            tail -n 250 "$RUNNER_TEMP/build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Raw logs need sign-in and summaries are JS-rendered, so also post the
      # tail as a PR comment where tooling (and the reviewer) can read it.
      - name: Comment the build log tail on the PR
        if: failure() && github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Android APK build failed — log tail"
            echo ""
            echo '```'
            tail -n 300 "$RUNNER_TEMP/build.log"
            echo '```'
          } > /tmp/logtail.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/logtail.md

      - name: List the produced APKs
        run: |
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;

      # A stable-named, PUBLICLY downloadable copy goes to GitHub Releases:
      # /releases/latest/download/<asset> needs no login at all, unlike
      # Actions artifacts.
      - name: Prepare the public release assets
        run: |
          # Failures are reported as annotations (readable without signing in);
          # an unexpected error reports the exact failing command.
          fail() {
            local m="$*"
            m="${m//'%'/%25}"; m="${m//$'\r'/%0D}"; m="${m//$'\n'/%0A}"
            echo "::error title=APK signing check::$m"
            exit 1
          }
          trap 'fail "unexpected error at line $LINENO: $BASH_COMMAND"' ERR
          NL=$'\n'
          UNIVERSAL=$(find src-tauri/gen/android/app/build/outputs/apk -name "app-universal-release.apk" -type f | head -n 1)
          if [ -z "$UNIVERSAL" ]; then
            UNIVERSAL=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-release.apk" -type f | sort | tail -n 1)
          fi
          if [ -z "$UNIVERSAL" ]; then
            fail "No release APK found"
          fi
          mkdir -p release-assets
          cp "$UNIVERSAL" release-assets/QORVYNA-AI-android.apk
          # Verify the APK is really signed before publishing it.
          TOOL=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          CERTS=$("$TOOL/apksigner" verify --print-certs "$UNIVERSAL" 2>&1) || fail "APK signature verification FAILED:${NL}$(grep -v "^WARNING" <<< "$CERTS" | tail -n 15)"
          # (apksigner may also print WARNING lines; show only the certificates.)
          grep "certificate" <<< "$CERTS" || true
          # ...and signed with the configured QORVYNA key. An APK signed with any
          # other certificate (e.g. a runner debug key) cannot update installed
          # copies — Android rejects it with "package conflicts with an existing
          # package" — so refuse to publish it.
          prop() { sed -n "s/^$1=//p" signing/keystore.properties; }
          KEYINFO=$(keytool -list -v -keystore "$(prop storeFile)" -alias "$(prop keyAlias)" -storepass "$(prop storePassword)" 2>&1) \
            || fail "keytool could not read the signing keystore:${NL}$(tail -n 5 <<< "$KEYINFO")"
          EXPECTED=$(sed -n "s/^[[:space:]]*SHA256: *//p" <<< "$KEYINFO" | tr -d ": " | tr "[:upper:]" "[:lower:]")
          # Signer labels differ by apksigner version ("Signer #1 certificate …",
          # "V2 Signer: certificate …"); every signer listed must be the QORVYNA key.
          DIGESTS=$(sed -n "s/^.*certificate SHA-256 digest: *//p" <<< "$CERTS" | tr -d ": " | tr "[:upper:]" "[:lower:]" | sort -u)
          ACTUAL=$(sed -n 1p <<< "$DIGESTS")
          echo "Expected signer SHA-256: $EXPECTED"
          echo "APK signer SHA-256:      $ACTUAL"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$DIGESTS" ]; then
            fail "APK is NOT signed with the QORVYNA release key — refusing to publish (it would not install as an update).${NL}expected: $EXPECTED${NL}actual:   ${DIGESTS//$NL/ }${NL}apksigner $("$TOOL/apksigner" version 2>&1 || true) ($TOOL), $(wc -l <<< "$CERTS") output lines:${NL}$(grep -v "^WARNING" <<< "$CERTS" | sed -n 1,25p)"
          fi
          echo "::notice title=APK signer::$ACTUAL (QORVYNA release key)"
          sha256sum release-assets/QORVYNA-AI-android.apk > release-assets/QORVYNA-AI-android.apk.sha256
          ls -lh release-assets

      - name: Publish the public APK release (apk-latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "QORVYNA AI — Android APK (latest)"
          body: |
            Installable release APK for `ai.matrix.desktop` — signed with the QORVYNA release key.

            **Direct download:** the `QORVYNA-AI-android.apk` asset below (or permanently at
            `https://github.com/dmoshiur/qorvyna-ai/releases/latest/download/QORVYNA-AI-android.apk`).

            - Wake word: say **“Hey AI” (হেই এআই)** — enrol it once under settings → Assistant.
            - “Continue with Google” works in the app; the Firebase config is baked in.
            - Per-ABI debug variants remain available as the **QORVYNA-AI-APK** build artifact.
            - Every build is signed with the same QORVYNA key, so new versions install as updates.
              If Android says *"App not installed as package conflicts with an existing package"*,
              the phone still has an older copy signed with a different (debug) key: uninstall
              QORVYNA AI once, then install this APK — later updates install in place.
          files: |
            release-assets/QORVYNA-AI-android.apk
            release-assets/QORVYNA-AI-android.apk.sha256
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload the full APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QORVYNA-AI-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: How to install
        run: |
          {
            echo "## QORVYNA AI APK"
            echo ""
            echo "**Public direct download:** \`https://github.com/dmoshiur/qorvyna-ai/releases/latest/download/QORVYNA-AI-android.apk\`"
            echo "(also on the [Releases page](https://github.com/dmoshiur/qorvyna-ai/releases/latest) as \`apk-latest\`)."
            echo ""
            echo "- Signed release build (universal: arm64 / armv7 / x86_64) — installs and updates in place."
            echo "- \"Package conflicts with an existing package\"? An older, differently-signed copy is installed: uninstall it once, then install."
            echo "- Wake word: say **“Hey AI” (হেই এআই)** — enrol it once under settings → Assistant."
            echo "- Firebase (Continue with Google) is baked into the bundle from google-services.json."
          } >> "$GITHUB_STEP_SUMMARY"
