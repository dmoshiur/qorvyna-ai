[package]
name = "matrix-ai-desktop"
version = "1.2.0"
description = "QORVYNA AI Desktop & Companion App — Native OS Notifications, Family Supervision & Device Telemetry"
authors = ["THAMJJ13.TOP White Hat Team"]
license = "Proprietary"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "matrix_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
# `unsafe-headers`: lets the app omit the Origin header so the backend treats
# app requests like its other bearer-token clients (src/lib/server/request-security.ts).
tauri-plugin-http = { version = "2.9", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
